---
name: Lint Build Publish

on: # yamllint disable-line rule:truthy
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Super-linter
        uses: super-linter/super-linter@4758be622215d0954c8353ee4877ffd60111cf8e # v6.4.1
        env:
          MULTI_STATUS: false
          VALIDATE_JSCPD: false
          # The repository mixes legacy dotfile snippets and active scripts;
          # keep ShellCheck semantic checks without rewriting those files.
          VALIDATE_SHELL_SHFMT: false
          FILTER_REGEX_EXCLUDE: >-
            \.sample-secret\.md|\.lcovrc\.gcov\.css|\/archiso\/.*\.sh|\/config\/(shell_gpt\/roles\/|weechat\/.*(pl|py|lua)|awesome\/.*lua)|\/scripts\/supermicro_ipmi\.sh|notes\/.*\.md|\/test\/source_idempotency\.zsh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Check .zshrc source idempotency
        run: ./test/source_idempotency.zsh

  validate-images:
    name: Validate ${{ matrix.distro }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux, fedora, gentoo, debian, brew]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build exact triggering revision
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: Dockerfile.${{ matrix.distro }}
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }},ignore-error=true
          push: false

  publish-images:
    name: Publish ${{ matrix.distro }} image
    if: github.event_name == 'push' && github.repository_owner == 'maxattax97'
    needs: [lint, validate-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            tags: latest,archlinux
          - distro: fedora
            tags: fedora
          - distro: gentoo
            tags: gentoo
          - distro: debian
            tags: debian
          - distro: brew
            tags: brew
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dotfiles
          tags: ${{ matrix.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push exact validated revision
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: Dockerfile.${{ matrix.distro }}
          build-args: |
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }},ignore-error=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
