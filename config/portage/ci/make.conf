# CI containers prefer official binpkgs and use portable flags for source-only
# fallbacks. Keep performance tuning for real Gentoo systems in ../make.conf.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LC_MESSAGES=C.utf8

AUTOCLEAN="yes"
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_NICENESS="10"
# Docker's default seccomp policy does not permit Portage to create Linux
# namespaces. Keep Portage's normal filesystem sandbox, but disable only the
# namespace-backed features for this CI container.
FEATURES="parallel-install parallel-fetch getbinpkg binpkg-request-signature \
    -ipc-sandbox -mount-sandbox -network-sandbox -pid-sandbox"
MAKEOPTS="-j16 -l16"
EMERGE_DEFAULT_OPTS="--jobs 4 --load-average 16"

GENTOO_MIRRORS="rsync://mirror.clarkson.edu/gentoo/ \
    rsync://rsync.gtlib.gatech.edu/gentoo \
    rsync://mirrors.mit.edu/gentoo-distfiles/ \
    rsync://mirrors.rit.edu/gentoo/"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE NVIDIA-CUDA NVIDIA-SDK NVIDIA-cuDNN NVIDIA-r1 NVIDIA-r2"
GRUB_PLATFORMS="efi-64"
