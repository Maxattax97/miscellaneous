<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- vim: ft=xml
-->
<fontconfig>
    <!--<match target="pattern">-->
        <!--<test qual="any" name="family"><string>Arial</string></test>-->
        <!--<edit name="family" mode="assign" binding="same"><string>FreeSans</string></edit>-->
    <!--</match>-->
    <!--<match target="pattern">-->
        <!--<test qual="any" name="family"><string>Helvetica</string></test>-->
        <!--<edit name="family" mode="assign" binding="same"><string>FreeSans</string></edit>-->
    <!--</match>-->
    <!--<match target="pattern">-->
        <!--<test qual="any" name="family"><string>Helvetica</string></test>-->
        <!--<edit name="family" mode="assign" binding="same"><string>FreeSans</string></edit>-->
    <!--</match>-->
    <alias>
        <family>serif</family>
        <prefer>
            <family>FreeSans</family>
        </prefer>
    </alias>
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>FreeSans</family>
        </prefer>
    </alias>
    <alias>
        <family>sans</family>
        <prefer>
            <family>FreeSans</family>
        </prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Hack Nerd Font Mono</family>
        </prefer>
    </alias>
    <alias>
        <family>Arial</family>
        <prefer>
            <family>FreeSans</family>
        </prefer>
    </alias>
    <alias>
        <family>Helvetica</family>
        <prefer>
            <family>FreeSans</family>
        </prefer>
    </alias>
    <!--
        Microsoft UI fonts. Their sites (e.g. the login page) list only named
        families with no generic fallback, so without a match Chromium/Firefox
        render the browser's default font, which is serif. Assigning the family
        (rather than a weak alias) is what makes browsers accept the substitute.
    -->
    <match target="pattern">
        <test qual="any" name="family"><string>Segoe UI</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Segoe UI Variable</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Segoe UI Web (West European)</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Aptos</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Tahoma</string></test>
        <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>Verdana</string></test>
        <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
    </match>
</fontconfig>
