# dirmngr's built-in resolver reads only /etc/resolv.conf. On macOS it misses
# scoped resolvers (VPN split DNS, mDNS), failing with "host not found", and it
# returns IPv6 addresses on IPv4-only networks, so a keyserver pool fetch fails
# with "No route to host" whenever it picks one. The system resolver avoids both.
standard-resolver
